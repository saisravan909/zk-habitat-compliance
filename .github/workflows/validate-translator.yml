name: Validate FRET-to-Circuit Tool Prototype

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate range-checked Circom circuit from FRET template
        run: |
          python fret-extension/fretish-to-zksnark/fret_to_circuit.py \
            --input fret-extension/templates/habitat_o2_requirement.json \
            --output /tmp/habitat_o2_compliance_ranged.circom
          test -s /tmp/habitat_o2_compliance_ranged.circom

      - name: Run synthetic telemetry policy check
        run: |
          python scripts/run_prototype_check.py
