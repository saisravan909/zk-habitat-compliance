name: Validate FRET-to-Circuit Tool Prototype

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify single-requirement IsEqual circuit generation and diff
        run: |
          python fret-extension/fretish-to-zksnark/fret_to_circuit.py \
            --input fret-extension/templates/habitat_o2_requirement.json \
            --output /tmp/habitat_o2_compliance_ranged.circom
          diff -u circuits/habitat_o2_compliance_ranged.circom /tmp/habitat_o2_compliance_ranged.circom

      - name: Verify multi-requirement IsEqual circuit generation and diff
        run: |
          python fret-extension/fretish-to-zksnark/fret_to_circuit.py \
            --input fret-extension/templates/habitat_multi_requirements.json \
            --output /tmp/habitat_multi_compliance.circom
          diff -u circuits/habitat_multi_compliance.circom /tmp/habitat_multi_compliance.circom

      - name: Run synthetic telemetry policy check
        run: |
          python scripts/run_prototype_check.py

      - name: Run deterministic and seeded synthetic evaluator-circuit check
        run: |
          python scripts/verify_evaluator_circuit.py --seed 20270111 --num-cases 250 --spec-id habitat_multi_compliance
